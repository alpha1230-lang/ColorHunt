<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="無数の同系色から、ひとつだけ違う色を探す色彩識別ゲーム。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="COLOR HUNT">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>COLOR HUNT</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --panel:#182438; --panel2:#202f46; --line:#30415a; --text:#f4f7fb; --muted:#a9b7ca; --accent:#8bd5ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -20%,#243b5b 0%,var(--bg) 60%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { color:inherit; font:inherit; }
    .app { width:min(100%,560px); margin:0 auto; padding: max(20px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom)); min-height:100vh; display:flex; flex-direction:column; gap:17px; }
    header { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:11px; }
    .logo { width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#70d4ff,#4b76db);display:grid;place-items:center;color:#10213b;font-weight:900;letter-spacing:-2px;box-shadow:0 6px 22px #3c8bd544; }
    h1 { font-size:17px; letter-spacing:2px; margin:0; }
    .subbrand { color:var(--muted);font-size:10px;letter-spacing:1.5px;margin-top:3px; }
    .iconbtn,.control,.primary { border:1px solid var(--line); background:var(--panel); border-radius:12px; min-height:42px; padding:9px 13px; cursor:pointer; }
    .iconbtn { width:42px;padding:0;font-size:19px; }
    .stats { display:grid;grid-template-columns:repeat(3,1fr);gap:9px; }
    .stat { background:#ffffff08;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center; }
    .stat small { color:var(--muted);font-size:10px;letter-spacing:1.5px; }
    .stat strong { display:block;font-size:25px;line-height:1.35;font-variant-numeric:tabular-nums; }
    .game-head { text-align:center; }
    .game-head h2 { font-size:19px;margin:0 0 5px; }
    .game-head p { color:var(--muted);font-size:12px;margin:0; }
    .board-wrap { position:relative; width:100%; height:min(55vh,490px); min-height:280px; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#0c1421; touch-action:none; box-shadow:inset 0 0 30px #0005; }
    .board { position:absolute;left:50%;top:50%;display:grid;gap:4px;transform:translate(-50%,-50%);transform-origin:center;will-change:transform; }
    .tile { border:0;border-radius:4px;aspect-ratio:1;min-width:0;min-height:0;padding:0;cursor:pointer;touch-action:manipulation; }
    .zoom-label { position:absolute;bottom:10px;right:10px;background:#101827dd;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--muted);pointer-events:none; }
    .zoom-controls { display:flex;justify-content:center;gap:8px; }
    .control { min-width:48px;font-weight:650; }
    .control:active,.primary:active,.iconbtn:active { transform:scale(.97); }
    .primary { background:linear-gradient(135deg,#8bd5ff,#75a9ff);color:#10213b;border:0;font-weight:800;flex:1; }
    .actions { display:flex;gap:9px; }
    .hint { text-align:center;color:var(--muted);font-size:11px;line-height:1.6; }
    .message { min-height:22px;font-size:14px;font-weight:700;color:var(--accent); }
    .footer { margin-top:auto;text-align:center;color:#8292a8;font-size:10px;letter-spacing:.4px; }
    .modal { position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:5; }
    .modal.show { display:grid; }
    .modal-card { width:min(100%,390px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 70px #0008; }
    .modal-card h3 { margin:0 0 10px; }
    .modal-card p,.modal-card li { color:var(--muted);font-size:13px;line-height:1.7; }
    .modal-card button { width:100%;margin-top:8px; }
    @media (max-height:700px) { .app{gap:11px;padding-top:12px}.board-wrap{height:43vh;min-height:230px}.footer{display:none} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">CH</div>
        <div><h1>COLOR HUNT</h1><div class="subbrand">COLOR PERCEPTION CHALLENGE</div></div>
      </div>
      <button class="iconbtn" id="help" aria-label="遊び方">?</button>
    </header>

    <section class="stats" aria-label="ゲーム成績">
      <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
      <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
      <div class="stat"><small>MISS</small><strong id="miss">0</strong></div>
    </section>

    <section class="game-head">
      <h2 id="headline">違う色を1つ見つけよう</h2>
      <p id="details">36マス · 色差 17.8%</p>
      <div class="message" id="message" aria-live="polite">準備はいい？</div>
    </section>

    <section class="board-wrap" id="boardWrap" aria-label="色探しゲーム盤">
      <div class="board" id="board"></div>
      <div class="zoom-label" id="zoomLabel">100%</div>
    </section>

    <div class="zoom-controls" aria-label="拡大縮小">
      <button class="control" id="zoomOut" aria-label="縮小">−</button>
      <button class="control" id="zoomReset">倍率リセット</button>
      <button class="control" id="zoomIn" aria-label="拡大">＋</button>
    </div>
    <div class="hint">2本指でピンチして拡大・縮小 · 拡大中はドラッグで移動</div>

    <div class="actions">
      <button class="control" id="restart">最初から</button>
      <button class="primary" id="continue">次のレベルへ →</button>
    </div>
    <div class="footer">COLOR HUNT · TRAIN YOUR EYES</div>
  </main>

  <div class="modal" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="modal-card">
      <h3 id="helpTitle">遊び方</h3>
      <ul>
        <li>同じ色のマスの中から、1つだけ違う色をタップ。</li>
        <li>正解するとレベルアップ。進むほど色の差が小さくなります。</li>
        <li>2本指でピンチすると拡大・縮小。拡大中は1本指で盤面を移動できます。</li>
        <li>誤タップしてもゲームオーバーにはなりません。</li>
      </ul>
      <button class="primary" id="closeHelp">閉じる</button>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let level=1, score=0, miss=0, target=0, zoom=1, panX=0, panY=0;
  let pointerMap=new Map(), gesture=null, lastWasCorrect=false;
  const count=()=>Math.min(36+Math.floor((level-1)/2)*12,144);
  const columns=()=>Math.ceil(Math.sqrt(count()));
  const diff=()=>Math.max(1.1,19-level*1.25);
  const randomTarget=()=>Math.floor(Math.random()*count());

  function render(){
    const n=count(), cols=columns(), d=diff(), board=$('board'), wrap=$('boardWrap');
    $('level').textContent=level; $('score').textContent=score; $('miss').textContent=miss;
    $('details').textContent=`${n}マス · 色差 ${d.toFixed(1)}%`;
    board.replaceChildren();
    const side=Math.min(wrap.clientWidth-24,wrap.clientHeight-24,Math.max(245,Math.min(440,level*7+270)));
    board.style.width=side+'px';
    board.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
    board.style.gap=side>340?'4px':'3px';
    for(let i=0;i<n;i++){
      const tile=document.createElement('button');
      tile.type='button'; tile.className='tile';
      tile.style.background=`hsl(210 55% ${i===target?58+d:58}%)`;
      tile.setAttribute('aria-label',i===target?'異なる色':'色のマス');
      tile.addEventListener('click',()=>{
        if(i===target){
          score++; level++; target=randomTarget(); zoom=1;panX=0;panY=0;
          $('message').textContent='正解！ 次のレベルへ';
          $('headline').textContent='見つけた！';
          render();
        } else {
          miss++; $('miss').textContent=miss;
          $('message').textContent='惜しい！ もう一度探そう';
        }
      });
      board.append(tile);
    }
    updateTransform();
  }
  function updateTransform(){
    $('board').style.transform=`translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px)) scale(${zoom})`;
    $('zoomLabel').textContent=Math.round(zoom*100)+'%';
  }
  function setZoom(value){
    zoom=Math.max(1,Math.min(3,value));
    if(zoom===1){panX=0;panY=0;}
    updateTransform();
  }
  $('zoomIn').addEventListener('click',()=>setZoom(zoom+.25));
  $('zoomOut').addEventListener('click',()=>setZoom(zoom-.25));
  $('zoomReset').addEventListener('click',()=>setZoom(1));
  $('restart').addEventListener('click',()=>{
    level=1;score=0;miss=0;target=randomTarget();setZoom(1);
    $('headline').textContent='違う色を1つ見つけよう';
    $('message').textContent='新しいゲームを始めよう';
    render();
  });
  $('continue').addEventListener('click',()=>{
    level++;target=randomTarget();setZoom(1);
    $('message').textContent='次のレベルに挑戦！';
    render();
  });
  $('help').addEventListener('click',()=>$('helpModal').classList.add('show'));
  $('closeHelp').addEventListener('click',()=>$('helpModal').classList.remove('show'));
  $('helpModal').addEventListener('click',e=>{if(e.target===$('helpModal'))$('helpModal').classList.remove('show');});

  const wrap=$('boardWrap');
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && e.button!==0)return;
    e.preventDefault(); wrap.setPointerCapture(e.pointerId);
    pointerMap.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointerMap.size===1) gesture={type:'pan',x:e.clientX,y:e.clientY,px:panX,py:panY};
    if(pointerMap.size===2){
      const p=[...pointerMap.values()];
      gesture={type:'pinch',distance:dist(p[0],p[1]),zoom,panX,panY};
    }
  });
  wrap.addEventListener('pointermove',e=>{
    if(!pointerMap.has(e.pointerId))return;
    pointerMap.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(!gesture)return;
    if(pointerMap.size>=2){
      const p=[...pointerMap.values()],g=gesture;
      if(g.type!=='pinch'){
        gesture={type:'pinch',distance:dist(p[0],p[1]),zoom,panX,panY};return;
      }
      setZoom(g.zoom*dist(p[0],p[1])/Math.max(1,g.distance));
    } else if(gesture.type==='pan' && zoom>1.001){
      panX=gesture.px+e.clientX-gesture.x; panY=gesture.py+e.clientY-gesture.y; updateTransform();
    }
  });
  function pointerEnd(e){
    pointerMap.delete(e.pointerId);
    if(pointerMap.size===1){
      const p=[...pointerMap.values()][0];
      gesture={type:'pan',x:p.x,y:p.y,px:panX,py:panY};
    } else gesture=null;
  }
  wrap.addEventListener('pointerup',pointerEnd);
  wrap.addEventListener('pointercancel',pointerEnd);
  window.addEventListener('resize',()=>{if(document.visibilityState==='visible')render();});
  target=randomTarget(); render();

  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
